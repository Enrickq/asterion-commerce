<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">What if your AI refused to pay? ASTERION</title>
  <desc id="desc">An original ASTERION cover. A customer-approved mandate controls agent spending. A red capture-blocked decision illustrates the refusal demonstrated in the film.</desc>
  <defs>
    <radialGradient id="sky" cx="85%" cy="40%" r="85%"><stop stop-color="#1c4248"/><stop offset=".65" stop-color="#09171e"/><stop offset="1" stop-color="#04090e"/></radialGradient>
    <radialGradient id="halo"><stop stop-color="#a8edd8" stop-opacity=".12"/><stop offset="1" stop-color="#a8edd8" stop-opacity="0"/></radialGradient>
    <linearGradient id="rule"><stop stop-color="#a8edd8"/><stop offset="1" stop-color="#294249"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="1050" cy="345" r="380" fill="url(#halo)"/>
  <g fill="#9fbfbd" opacity=".5"><circle cx="920" cy="56" r="1.6"/><circle cx="1007" cy="92" r="1.2"/><circle cx="1198" cy="160" r="1.8"/><circle cx="884" cy="176" r="1"/><circle cx="1127" cy="193" r="1.4"/><circle cx="1211" cy="83" r="1"/><circle cx="1236" cy="567" r="1.8"/><circle cx="965" cy="605" r="1.3"/><circle cx="852" cy="548" r="1"/><circle cx="1179" cy="648" r="1.6"/></g>
  <path d="m86 48 5 15 15 5-15 5-5 15-5-15-15-5 15-5Z" fill="#a8edd8"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="126" y="78" font-size="27" font-weight="700" letter-spacing="6" fill="#f1f5f0">ASTERION</text>
    <text x="1208" y="77" font-size="20" letter-spacing="2.2" text-anchor="end" fill="#a4babe">PAYPAL AI HACKATHON</text>
    <path d="M72 120H1208" stroke="url(#rule)" opacity=".65"/>
    <text x="74" y="184" font-size="21" letter-spacing="4" fill="#a8edd8">AGENTIC COMMERCE</text>
    <text x="66" y="298" font-size="104" font-weight="700" fill="#f1f5f0">WHAT IF</text>
    <text x="66" y="409" font-size="104" font-weight="700" fill="#f1f5f0">YOUR AI</text>
    <text x="66" y="521" font-size="88" font-weight="700" letter-spacing="-2" fill="#a8edd8">REFUSED TO PAY?</text>
    <text x="74" y="647" font-size="23" font-weight="700" letter-spacing="1.4" fill="#b9d3d1">AGENTS NEGOTIATE. EVIDENCE UNLOCKS PAYMENT.</text>
  </g>
  <g transform="translate(1050 325)" fill="none" stroke="#a8edd8">
    <circle r="173" opacity=".21"/><circle r="143" opacity=".18"/>
    <ellipse rx="173" ry="64" transform="rotate(-33)" opacity=".2"/>
    <ellipse rx="173" ry="64" transform="rotate(48)" opacity=".16"/>
    <path d="M-153-80-68-133 46-54 138-78 169 28 62 112-27 72-118 130" opacity=".3"/>
    <g fill="#a8edd8" stroke="none"><circle cx="-153" cy="-80" r="4"/><circle cx="-68" cy="-133" r="5"/><circle cx="46" cy="-54" r="4"/><circle cx="138" cy="-78" r="4"/><circle cx="169" cy="28" r="5"/><circle cx="62" cy="112" r="4"/></g>
  </g>
  <rect x="914" y="295" width="272" height="165" rx="20" fill="#102028" stroke="#506065"/>
  <path d="m1050 320 0 26m0 12 0 2" stroke="#f28c85" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700"><text x="1050" y="399" font-size="31" letter-spacing="2" fill="#f1f5f0">CAPTURE</text><text x="1050" y="438" font-size="34" letter-spacing="1" fill="#f28c85">BLOCKED</text></g>
</svg>
