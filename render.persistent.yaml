# OPTIONAL PAID TEMPLATE. Do not deploy without explicit budget approval.
# Demo mode remains mandatory for this public example.
services:
  - type: web
    name: asterion-persistent
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: PUBLIC_DEMO
        value: "true"
      - key: PAYMENTS_MODE
        value: demo
      - key: AGENT_MODE
        value: deterministic
      - key: WEATHER_MODE
        value: fixtures
    disk:
      name: asterion-data
      mountPath: /var/data
      sizeGB: 1
